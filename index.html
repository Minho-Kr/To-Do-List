<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>To-Do List</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --primary: #FF6B00;
            --primary-dark: #E84C1B;
            --bg-main: #EAECF0;
            --bg-secondary: #F8F9FA;
            --bg-card: #FFFFFF;
            --text-primary: #212529;
            --text-secondary: #6C757D;
            --border: #DEE2E6;
            --success: #28A745;
            --danger: #DC3545;
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.08);
            --shadow-md: 0 4px 12px rgba(0,0,0,0.14);
            --shadow-lg: 0 8px 24px rgba(0,0,0,0.16);
            --radius: 10px;
            --tr: all 0.18s ease;
        }

        body.dark-mode {
            --bg-main: #1A1D23;
            --bg-secondary: #2C3038;
            --bg-card: #25282F;
            --text-primary: #E8EAED;
            --text-secondary: #9AA0A6;
            --border: #3C4043;
        }

        @media (prefers-color-scheme: dark) {
            body:not(.light-mode) {
                --bg-main: #1A1D23;
                --bg-secondary: #2C3038;
                --bg-card: #25282F;
                --text-primary: #E8EAED;
                --text-secondary: #9AA0A6;
                --border: #3C4043;
            }
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 16px;
            overflow: hidden;
        }

        .container {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 980px;
            height: calc(100vh - 32px);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── HEADER ── */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 50%, rgba(255,255,255,0.08) 0%, transparent 60%);
            pointer-events: none;
        }

        .profile-image {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid rgba(255,255,255,0.35);
            object-fit: cover;
            flex-shrink: 0;
            cursor: pointer;
            transition: var(--tr);
        }

        .profile-image:hover { transform: scale(1.06); }

        .header-info { flex: 1; min-width: 0; }

        .header-info h1 {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .header-info .subtitle {
            font-size: 11px;
            opacity: 0.85;
            margin-top: 1px;
        }

        .datetime-box {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            font-size: 12px;
            opacity: 0.92;
            gap: 1px;
            flex-shrink: 0;
        }

        .datetime-box #currentTime { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; }

        .header-btn {
            width: 34px;
            height: 34px;
            background: rgba(255,255,255,0.18);
            border: 1px solid rgba(255,255,255,0.28);
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: var(--tr);
            color: white;
            flex-shrink: 0;
        }

        .header-btn:hover { background: rgba(255,255,255,0.32); }

        /* ── INPUT SECTION ── */
        .input-section {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .input-row {
            display: flex;
            gap: 7px;
            align-items: center;
        }

        #todoInput {
            flex: 1;
            padding: 8px 11px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 14px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            transition: var(--tr);
            min-width: 0;
        }

        #todoInput:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(255,107,0,0.1);
        }

        #deadlineInput {
            padding: 8px 8px;
            border: 2px solid var(--border);
            border-radius: var(--radius);
            font-size: 13px;
            background: var(--bg-card);
            color: var(--text-primary);
            font-family: inherit;
            cursor: pointer;
            transition: var(--tr);
            width: 138px;
            flex-shrink: 0;
        }

        #deadlineInput:focus { outline: none; border-color: var(--primary); }

        body.dark-mode #deadlineInput,
        body.dark-mode #todoInput { color-scheme: dark; }

        @media (prefers-color-scheme: dark) {
            body:not(.light-mode) #deadlineInput,
            body:not(.light-mode) #todoInput { color-scheme: dark; }
        }

        #addBtn {
            padding: 8px 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            border: none;
            border-radius: var(--radius);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: var(--tr);
            flex-shrink: 0;
        }

        #addBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: var(--shadow-sm); }
        #addBtn:disabled { opacity: 0.45; cursor: not-allowed; }

        /* ── AUTOCOMPLETE ── */
        .autocomplete-dropdown {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            z-index: 400;
            max-height: 200px;
            overflow-y: auto;
            display: none;
        }

        .autocomplete-dropdown.visible { display: block; }

        .autocomplete-item {
            padding: 7px 12px;
            cursor: pointer;
            font-size: 13px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--border);
            transition: background 0.12s;
        }

        .autocomplete-item:last-child { border-bottom: none; }

        .autocomplete-item:hover,
        .autocomplete-item.ac-selected {
            background: rgba(255,107,0,0.1);
            color: var(--primary);
        }

        /* ── FILTER + HISTORY ── */
        .filter-section {
            padding: 6px 12px;
            display: flex;
            gap: 7px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            align-items: center;
            flex-shrink: 0;
        }

        .filter-btn {
            flex: 1;
            padding: 6px 8px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: var(--tr);
            color: var(--text-secondary);
            font-family: inherit;
        }

        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .filter-btn:hover:not(.active) { border-color: var(--primary); color: var(--primary); }

        .badge {
            display: inline-block;
            margin-left: 4px;
            padding: 0 5px;
            background: rgba(255,255,255,0.28);
            border-radius: 9px;
            font-size: 10px;
            font-weight: 600;
        }

        .filter-btn:not(.active) .badge {
            background: var(--bg-secondary);
            color: var(--text-secondary);
        }

        .history-btn {
            padding: 6px 11px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 7px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            font-family: inherit;
            transition: var(--tr);
            white-space: nowrap;
            flex-shrink: 0;
        }

        .history-btn:hover { border-color: var(--primary); color: var(--primary); }

        /* ── STATS ── */
        .stats {
            padding: 4px 14px;
            background: var(--bg-secondary);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-secondary);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .stats strong { color: var(--primary); font-size: 13px; font-weight: 700; }

        /* ── TODO LIST ── */
        .todo-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 7px;
            min-height: 0;
        }

        .todo-list::-webkit-scrollbar { width: 6px; }
        .todo-list::-webkit-scrollbar-track { background: var(--bg-secondary); }
        .todo-list::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }
        .todo-list { scrollbar-width: thin; scrollbar-color: var(--primary) var(--bg-secondary); }

        /* ── TODO ITEM ── */
        .todo-item {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 6px 10px 6px 8px;
            margin: 3px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-left: 4px solid transparent;
            border-radius: 8px;
            transition: box-shadow 0.15s, opacity 0.15s;
            position: relative;
        }

        .todo-item:hover { box-shadow: var(--shadow-sm); }

        .todo-item.completed { opacity: 0.6; }

        /* ── DRAG HANDLE ── */
        .drag-handle {
            cursor: grab;
            color: var(--text-secondary);
            font-size: 17px;
            line-height: 1;
            padding: 0 3px;
            user-select: none;
            flex-shrink: 0;
            opacity: 0.45;
            transition: opacity 0.15s;
            letter-spacing: -1px;
        }

        .drag-handle:hover  { opacity: 0.9; }
        .drag-handle:active { cursor: grabbing; }

        .todo-item.drag-over-top {
            border-top: 3px solid var(--primary) !important;
        }

        .todo-item.drag-over-bottom {
            border-bottom: 3px solid var(--primary) !important;
        }

        .todo-item.dragging {
            opacity: 0.38;
            box-shadow: var(--shadow-md);
        }

        /* ── CHECKBOX ── */
        .checkbox {
            width: 19px;
            height: 19px;
            border: 2px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--tr);
            flex-shrink: 0;
        }

        .checkbox:hover { border-color: var(--primary); transform: scale(1.1); }

        .checkbox.checked {
            background: var(--primary);
            border-color: var(--primary);
        }

        .checkbox.checked::after {
            content: '✓';
            color: white;
            font-size: 11px;
            font-weight: bold;
        }

        /* ── TODO CONTENT ── */
        .todo-content { flex: 1; min-width: 0; }

        .todo-text {
            font-size: 13px;
            line-height: 1.3;
            color: var(--text-primary);
            word-break: break-word;
        }

        .todo-item.completed .todo-text {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .todo-meta {
            display: flex;
            gap: 8px;
            margin-top: 2px;
            flex-wrap: wrap;
            align-items: center;
        }

        .meta-tag {
            font-size: 10px;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .dl-future  { color: var(--text-secondary); }
        .dl-today   { color: #f97316; font-weight: 600; }
        .dl-overdue { color: var(--danger); font-weight: 600; }
        .done-tag   { color: var(--success); }

        /* ── COLOR BUTTON ── */
        .color-btn {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            border: 2px solid var(--border);
            cursor: pointer;
            background: transparent;
            font-size: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            padding: 0;
            transition: transform 0.15s;
            line-height: 1;
        }

        .color-btn:hover { transform: scale(1.25); }

        /* ── DELETE BUTTON ── */
        .delete-btn {
            padding: 3px 9px;
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--danger);
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: var(--tr);
            flex-shrink: 0;
            font-family: inherit;
        }

        .delete-btn:hover { background: var(--danger); color: white; }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text-secondary);
        }

        .empty-state-icon { font-size: 44px; margin-bottom: 10px; opacity: 0.35; }
        .empty-state-text { font-size: 14px; }

        /* ── FOOTER ── */
        .footer {
            padding: 5px 14px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--success);
            flex-shrink: 0;
        }

        /* ── COLOR PICKER POPUP ── */
        #colorPickerPopup {
            position: fixed;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            padding: 7px;
            display: none;
            flex-wrap: wrap;
            gap: 5px;
            width: 126px;
            z-index: 300;
        }

        .color-swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.12s;
            flex-shrink: 0;
        }

        .color-swatch:hover { transform: scale(1.25); }
        .color-swatch.sw-selected { border-color: var(--text-primary); transform: scale(1.15); }

        .color-swatch.sw-none {
            background: var(--bg-secondary);
            border: 2px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 9px;
        }

        /* ── HISTORY MODAL ── */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.52);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s, visibility 0.2s;
        }

        .modal-overlay.visible { opacity: 1; visibility: visible; }

        .modal-content {
            background: var(--bg-card);
            border-radius: var(--radius);
            width: 100%;
            max-width: 660px;
            max-height: 78vh;
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            transform: scale(0.96);
            transition: transform 0.2s;
        }

        .modal-overlay.visible .modal-content { transform: scale(1); }

        .modal-header {
            padding: 12px 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 9px;
            flex-shrink: 0;
        }

        .modal-header h2 { font-size: 15px; font-weight: 600; flex-shrink: 0; }

        #historySearch {
            flex: 1;
            padding: 6px 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 13px;
            background: var(--bg-secondary);
            color: var(--text-primary);
            font-family: inherit;
        }

        #historySearch:focus { outline: none; border-color: var(--primary); }

        .modal-close {
            width: 26px;
            height: 26px;
            border: 1px solid var(--border);
            border-radius: 5px;
            cursor: pointer;
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--tr);
            flex-shrink: 0;
        }

        .modal-close:hover { background: var(--danger); color: white; border-color: var(--danger); }

        .modal-body {
            flex: 1;
            overflow-y: auto;
            padding: 7px 10px;
        }

        .modal-body::-webkit-scrollbar { width: 5px; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 3px; }

        .history-item {
            padding: 7px 10px;
            border: 1px solid var(--border);
            border-left: 3px solid var(--text-secondary);
            border-radius: 6px;
            margin: 3px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .history-item.hr-completed { border-left-color: var(--success); }
        .history-item.hr-deleted   { border-left-color: var(--danger); }

        .history-content { flex: 1; min-width: 0; }

        .history-text {
            font-size: 13px;
            color: var(--text-primary);
            word-break: break-word;
        }

        .history-dates {
            font-size: 10px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        .history-readd-btn {
            padding: 4px 9px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            flex-shrink: 0;
            font-family: inherit;
            transition: var(--tr);
        }

        .history-readd-btn:hover { opacity: 0.82; }

        .modal-empty {
            text-align: center;
            padding: 30px;
            color: var(--text-secondary);
            font-size: 13px;
        }

        /* ── TOAST ── */
        .toast {
            position: fixed;
            bottom: 18px;
            right: 18px;
            padding: 9px 16px;
            background: var(--text-primary);
            color: var(--bg-card);
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 2000;
            font-size: 13px;
            animation: toastIn 0.25s ease-out;
        }

        .toast.success { background: var(--success); color: white; }
        .toast.error   { background: var(--danger);  color: white; }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <img src="profile.png" alt="프로필" class="profile-image" id="profileImage">
            <div class="header-info">
                <h1>To-Do List</h1>
                <div class="subtitle" id="currentDate">날짜 로딩중...</div>
            </div>
            <div class="datetime-box">
                <span id="currentTime">00:00:00</span>
            </div>
            <button class="header-btn" id="themeToggle" title="테마 전환">
                <span id="themeIcon">🌙</span>
            </button>
        </header>

        <section class="input-section">
            <form class="input-row" onsubmit="return false;">
                <input type="text" id="todoInput" placeholder="오늘 할 일을 입력하세요..." autocomplete="off" maxlength="200">
                <input type="date" id="deadlineInput">
                <button id="addBtn" type="submit" disabled>추가</button>
            </form>
        </section>

        <nav class="filter-section">
            <button class="filter-btn active" data-filter="all">전체 <span class="badge" id="badgeAll">0</span></button>
            <button class="filter-btn" data-filter="active">진행중 <span class="badge" id="badgeActive">0</span></button>
            <button class="filter-btn" data-filter="completed">완료 <span class="badge" id="badgeCompleted">0</span></button>
            <button class="history-btn" id="historyBtn">📋 이력 조회</button>
        </nav>

        <div class="stats">
            <span>전체 <strong id="totalCount">0</strong></span>
            <span>진행중 <strong id="activeCount">0</strong></span>
            <span>완료 <strong id="completedCount">0</strong></span>
        </div>

        <section class="todo-list" id="todoList"></section>

        <footer class="footer">
            <span class="status-dot" id="statusDot"></span>
            <span id="networkText">온라인</span>
        </footer>
    </div>

    <!-- History Modal -->
    <div id="historyModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>📋 이력 조회</h2>
                <input type="text" id="historySearch" placeholder="텍스트 검색...">
                <button class="modal-close" id="modalClose">✕</button>
            </div>
            <div class="modal-body" id="historyBody"></div>
        </div>
    </div>

    <!-- Color Picker Popup (fixed, outside container) -->
    <div id="colorPickerPopup"></div>

    <!-- Autocomplete Dropdown (fixed) -->
    <div id="autocompleteDropdown" class="autocomplete-dropdown"></div>

    <script>
    'use strict';

    const COLORS = [
        { value: '',        label: '기본' },
        { value: '#ef4444', label: '빨강' },
        { value: '#f97316', label: '주황' },
        { value: '#eab308', label: '노랑' },
        { value: '#22c55e', label: '초록' },
        { value: '#14b8a6', label: '청록' },
        { value: '#3b82f6', label: '파랑' },
        { value: '#8b5cf6', label: '보라' },
        { value: '#ec4899', label: '분홍' },
    ];

    /* ─── History DB ─────────────────────────────────────── */
    class HistoryDB {
        constructor() { this.KEY = 'todo-history-v2'; }

        load() {
            try { return JSON.parse(localStorage.getItem(this.KEY) || '[]'); }
            catch { return []; }
        }

        save(arr) {
            try { localStorage.setItem(this.KEY, JSON.stringify(arr)); } catch {}
        }

        add(todo, reason) {
            const h = this.load();
            // skip duplicate archiving of same id+reason
            if (h.some(e => e.id === todo.id && e.archiveReason === reason)) return;
            h.unshift({ ...todo, archivedAt: new Date().toISOString(), archiveReason: reason });
            if (h.length > 500) h.length = 500;
            this.save(h);
        }

        search(query) {
            const h = this.load();
            if (!query) return h;
            const q = query.toLowerCase();
            return h.filter(e => e.text.toLowerCase().includes(q));
        }

        uniqueTexts() {
            const seen = new Set();
            return this.load().filter(h => {
                if (seen.has(h.text)) return false;
                seen.add(h.text);
                return true;
            }).map(h => h.text);
        }
    }

    /* ─── TodoApp ────────────────────────────────────────── */
    class TodoApp {
        constructor() {
            this.todos       = this.loadTodos();
            this.filter      = 'all';
            this.saveTimer   = null;
            this.theme       = this.loadTheme();
            this.db          = new HistoryDB();
            this.activeColor = null;   // id of todo whose color picker is open
            this.acIndex     = -1;
            this.acItems     = [];

            this.el = {
                input:      document.getElementById('todoInput'),
                deadline:   document.getElementById('deadlineInput'),
                addBtn:     document.getElementById('addBtn'),
                list:       document.getElementById('todoList'),
                filterBtns: document.querySelectorAll('.filter-btn'),
                total:      document.getElementById('totalCount'),
                active:     document.getElementById('activeCount'),
                completed:  document.getElementById('completedCount'),
                bAll:       document.getElementById('badgeAll'),
                bActive:    document.getElementById('badgeActive'),
                bCompleted: document.getElementById('badgeCompleted'),
                themeBtn:   document.getElementById('themeToggle'),
                themeIcon:  document.getElementById('themeIcon'),
                dateEl:     document.getElementById('currentDate'),
                timeEl:     document.getElementById('currentTime'),
                netText:    document.getElementById('networkText'),
                statusDot:  document.getElementById('statusDot'),
                historyBtn: document.getElementById('historyBtn'),
                modal:      document.getElementById('historyModal'),
                hSearch:    document.getElementById('historySearch'),
                hBody:      document.getElementById('historyBody'),
                mClose:     document.getElementById('modalClose'),
                acDrop:     document.getElementById('autocompleteDropdown'),
                colorPopup: document.getElementById('colorPickerPopup'),
            };

            this.init();
        }

        /* ── INIT ── */
        init() {
            this.applyTheme(this.theme);
            this.resetDeadline();
            this.buildColorPicker();
            this.bindEvents();
            this.bindDrag();
            this.bindNetwork();
            this.updateClock();
            setInterval(() => this.updateClock(), 1000);
            this.render();
            this.el.input.focus();
        }

        resetDeadline() {
            const d = new Date();
            this.el.deadline.value = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        }

        /* ── STORAGE ── */
        loadTodos() {
            try {
                const arr = JSON.parse(localStorage.getItem('smart-todos') || '[]');
                return Array.isArray(arr) ? arr.map(t => ({
                    id: t.id, text: t.text, completed: !!t.completed,
                    createdAt: t.createdAt || new Date().toISOString(),
                    deadline: t.deadline || '',
                    color: t.color || '',
                    completedAt: t.completedAt || null,
                })) : [];
            } catch { return []; }
        }

        save() {
            clearTimeout(this.saveTimer);
            this.saveTimer = setTimeout(() => {
                try { localStorage.setItem('smart-todos', JSON.stringify(this.todos)); }
                catch { this.toast('저장 실패', 'error'); }
            }, 200);
        }

        /* ── THEME ── */
        loadTheme() {
            try {
                const s = localStorage.getItem('theme-preference');
                if (s === 'dark' || s === 'light') return s;
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            } catch { return 'light'; }
        }

        applyTheme(t) {
            document.body.classList.toggle('dark-mode',  t === 'dark');
            document.body.classList.toggle('light-mode', t !== 'dark');
            this.el.themeIcon.textContent = t === 'dark' ? '☀️' : '🌙';
        }

        toggleTheme() {
            this.theme = this.theme === 'dark' ? 'light' : 'dark';
            this.applyTheme(this.theme);
            try { localStorage.setItem('theme-preference', this.theme); } catch {}
        }

        /* ── CLOCK ── */
        updateClock() {
            const n = new Date();
            const days = ['일','월','화','수','목','금','토'];
            this.el.dateEl.textContent = `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${days[n.getDay()]}요일`;
            this.el.timeEl.textContent = [n.getHours(), n.getMinutes(), n.getSeconds()]
                .map(v => String(v).padStart(2,'0')).join(':');
        }

        /* ── NETWORK ── */
        bindNetwork() {
            const update = () => {
                const on = navigator.onLine;
                this.el.netText.textContent = on ? '온라인' : '오프라인 (로컬 저장)';
                this.el.statusDot.style.background = on ? 'var(--success)' : 'var(--danger)';
            };
            window.addEventListener('online',  update);
            window.addEventListener('offline', update);
            update();
        }

        /* ── COLOR PICKER ── */
        buildColorPicker() {
            const pop = this.el.colorPopup;
            pop.style.cssText = 'position:fixed;display:none;flex-wrap:wrap;gap:5px;padding:7px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-md);width:126px;z-index:300;';

            pop.innerHTML = COLORS.map(c =>
                `<div class="color-swatch ${c.value ? '' : 'sw-none'}"
                      data-color="${c.value}"
                      title="${c.label}"
                      style="${c.value ? `background:${c.value}` : ''}"></div>`
            ).join('');

            pop.querySelectorAll('.color-swatch').forEach(sw => {
                sw.addEventListener('click', e => {
                    e.stopPropagation();
                    if (this.activeColor !== null) {
                        const t = this.todos.find(t => t.id === this.activeColor);
                        if (t) { t.color = sw.dataset.color; this.save(); this.render(); }
                    }
                    this.closeColorPicker();
                });
            });
        }

        openColorPicker(id, anchorEl) {
            this.activeColor = id;
            const todo = this.todos.find(t => t.id === id);
            const cur  = todo ? todo.color : '';
            this.el.colorPopup.querySelectorAll('.color-swatch').forEach(sw => {
                sw.classList.toggle('sw-selected', sw.dataset.color === cur);
            });
            const r = anchorEl.getBoundingClientRect();
            let top  = r.bottom + 4;
            let left = r.right - 126;
            if (left < 8) left = 8;
            if (top + 90 > window.innerHeight) top = r.top - 94;
            this.el.colorPopup.style.top  = `${top}px`;
            this.el.colorPopup.style.left = `${left}px`;
            this.el.colorPopup.style.display = 'flex';
        }

        closeColorPicker() {
            this.el.colorPopup.style.display = 'none';
            this.activeColor = null;
        }

        /* ── AUTOCOMPLETE ── */
        updateAC() {
            const val = this.el.input.value.trim().toLowerCase();
            if (!val) { this.hideAC(); return; }

            const texts = this.db.uniqueTexts();
            this.acItems = texts.filter(t => t.toLowerCase().includes(val)).slice(0, 8);
            if (!this.acItems.length) { this.hideAC(); return; }

            this.acIndex = -1;
            this.el.acDrop.innerHTML = this.acItems.map((t, i) =>
                `<div class="autocomplete-item" data-i="${i}">${this.esc(t)}</div>`
            ).join('');

            this.el.acDrop.querySelectorAll('.autocomplete-item').forEach((el, i) => {
                el.addEventListener('mousedown', e => { e.preventDefault(); this.pickAC(i); });
            });

            const r = this.el.input.getBoundingClientRect();
            this.el.acDrop.style.top   = `${r.bottom + 2}px`;
            this.el.acDrop.style.left  = `${r.left}px`;
            this.el.acDrop.style.width = `${r.width}px`;
            this.el.acDrop.classList.add('visible');
        }

        highlightAC() {
            this.el.acDrop.querySelectorAll('.autocomplete-item').forEach((el, i) => {
                el.classList.toggle('ac-selected', i === this.acIndex);
            });
        }

        pickAC(i) {
            if (i >= 0 && i < this.acItems.length) {
                this.el.input.value = this.acItems[i];
                this.el.addBtn.disabled = false;
            }
            this.hideAC();
        }

        hideAC() {
            this.el.acDrop.classList.remove('visible');
            this.acIndex = -1;
        }

        /* ── EVENTS ── */
        bindEvents() {
            this.el.themeBtn.addEventListener('click', () => this.toggleTheme());
            this.el.addBtn.addEventListener('click', () => this.addTodo());

            this.el.input.addEventListener('input', () => {
                this.el.addBtn.disabled = !this.el.input.value.trim();
                this.updateAC();
            });

            this.el.input.addEventListener('keydown', e => {
                const acOpen = this.el.acDrop.classList.contains('visible');
                if (acOpen) {
                    if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.acIndex = Math.min(this.acIndex + 1, this.acItems.length - 1);
                        this.highlightAC(); return;
                    }
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.acIndex = Math.max(this.acIndex - 1, -1);
                        this.highlightAC(); return;
                    }
                    if (e.key === 'Enter' && this.acIndex >= 0) {
                        e.preventDefault(); this.pickAC(this.acIndex); return;
                    }
                    if (e.key === 'Escape') { this.hideAC(); return; }
                }
                if (e.key === 'Enter') this.addTodo();
            });

            this.el.input.addEventListener('blur', () => {
                setTimeout(() => this.hideAC(), 160);
            });

            this.el.filterBtns.forEach(btn => {
                btn.addEventListener('click', () => this.setFilter(btn.dataset.filter));
            });

            // Delegated events on todo list
            this.el.list.addEventListener('click', e => {
                const item = e.target.closest('.todo-item');
                if (!item) return;
                const id = parseInt(item.dataset.id);
                if (e.target.closest('.drag-handle')) return;
                if (e.target.closest('.checkbox'))   { this.toggleTodo(id); return; }
                if (e.target.closest('.delete-btn')) { this.deleteTodo(id); return; }
                if (e.target.closest('.color-btn')) {
                    const btn = e.target.closest('.color-btn');
                    if (this.activeColor === id) this.closeColorPicker();
                    else this.openColorPicker(id, btn);
                    return;
                }
            });

            // History
            this.el.historyBtn.addEventListener('click', () => this.openHistory());
            this.el.mClose.addEventListener('click', () => this.closeHistory());
            this.el.modal.addEventListener('click', e => { if (e.target === this.el.modal) this.closeHistory(); });
            this.el.hSearch.addEventListener('input', () => this.renderHistory());
            this.el.hBody.addEventListener('click', e => {
                const btn = e.target.closest('.history-readd-btn');
                if (btn) this.readdHistory(parseInt(btn.dataset.idx));
            });

            // Close color picker on outside click
            document.addEventListener('click', e => {
                if (this.activeColor !== null &&
                    !e.target.closest('#colorPickerPopup') &&
                    !e.target.closest('.color-btn')) {
                    this.closeColorPicker();
                }
            });

            // Global shortcuts
            document.addEventListener('keydown', e => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault(); this.el.input.focus();
                }
                if (e.key === 'Escape') {
                    this.closeColorPicker();
                    this.closeHistory();
                }
            });
        }

        /* ── CRUD ── */
        addTodo() {
            const text = this.el.input.value.trim();
            if (!text) { this.el.input.focus(); return; }

            this.todos.unshift({
                id: Date.now(),
                text,
                completed: false,
                createdAt: new Date().toISOString(),
                deadline: this.el.deadline.value || '',
                color: '',
                completedAt: null,
            });
            this.save();
            this.el.input.value = '';
            this.el.addBtn.disabled = true;
            this.resetDeadline();
            this.hideAC();
            this.el.input.focus();
            this.render();
            this.toast('할일 추가됨', 'success');
        }

        toggleTodo(id) {
            const t = this.todos.find(t => t.id === id);
            if (!t) return;
            t.completed = !t.completed;
            t.completedAt = t.completed ? new Date().toISOString() : null;
            if (t.completed) this.db.add(t, 'completed');
            this.save();
            this.render();
        }

        deleteTodo(id) {
            const t = this.todos.find(t => t.id === id);
            if (!t) return;
            if (!confirm(`"${t.text}"\n삭제하시겠습니까?`)) return;
            this.db.add(t, 'deleted');
            this.todos = this.todos.filter(t => t.id !== id);
            this.closeColorPicker();
            this.save();
            this.render();
            this.toast('삭제됨', 'success');
        }

        /* ── DRAG & DROP ── */
        bindDrag() {
            let dragId   = null;
            let lastDown = null;

            document.addEventListener('mousedown', e => { lastDown = e.target; });

            this.el.list.addEventListener('dragstart', e => {
                const item = e.target.closest('.todo-item');
                if (!item || !lastDown?.closest('.drag-handle')) {
                    e.preventDefault(); return;
                }
                dragId = parseInt(item.dataset.id);
                item.classList.add('dragging');
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', String(dragId));
            });

            this.el.list.addEventListener('dragend', () => {
                this.el.list.querySelectorAll('.dragging, .drag-over-top, .drag-over-bottom')
                    .forEach(el => el.classList.remove('dragging', 'drag-over-top', 'drag-over-bottom'));
                dragId = null;
            });

            this.el.list.addEventListener('dragover', e => {
                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                const item = e.target.closest('.todo-item');
                if (!item || parseInt(item.dataset.id) === dragId) return;

                this.el.list.querySelectorAll('.drag-over-top, .drag-over-bottom')
                    .forEach(el => el.classList.remove('drag-over-top', 'drag-over-bottom'));

                const r      = item.getBoundingClientRect();
                const isAfter = e.clientY > r.top + r.height / 2;
                item.classList.add(isAfter ? 'drag-over-bottom' : 'drag-over-top');
            });

            this.el.list.addEventListener('dragleave', e => {
                const item = e.target.closest('.todo-item');
                if (item) item.classList.remove('drag-over-top', 'drag-over-bottom');
            });

            this.el.list.addEventListener('drop', e => {
                e.preventDefault();
                const targetItem = e.target.closest('.todo-item');
                if (!targetItem || dragId === null) return;

                const targetId = parseInt(targetItem.dataset.id);
                if (targetId === dragId) return;

                const r       = targetItem.getBoundingClientRect();
                const isAfter = e.clientY > r.top + r.height / 2;

                const filtered  = this.getFiltered();
                const srcFi     = filtered.findIndex(t => t.id === dragId);
                const tgtFi     = filtered.findIndex(t => t.id === targetId);
                if (srcFi < 0 || tgtFi < 0) return;

                const srcMainIdx = this.todos.findIndex(t => t.id === dragId);
                const [removed]  = this.todos.splice(srcMainIdx, 1);

                const tgtMainIdx = this.todos.findIndex(t => t.id === targetId);
                this.todos.splice(isAfter ? tgtMainIdx + 1 : tgtMainIdx, 0, removed);

                this.closeColorPicker();
                this.save();
                this.render();
            });
        }

        setFilter(f) {
            this.filter = f;
            this.el.filterBtns.forEach(b => b.classList.toggle('active', b.dataset.filter === f));
            this.render();
        }

        getFiltered() {
            if (this.filter === 'active')    return this.todos.filter(t => !t.completed);
            if (this.filter === 'completed') return this.todos.filter(t =>  t.completed);
            return this.todos;
        }

        /* ── RENDER ── */
        fmtDeadline(dl) {
            if (!dl) return null;
            const now = new Date();
            const today = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
            if (dl === today) return { cls: 'dl-today',   label: '오늘 마감' };
            if (dl < today)   return { cls: 'dl-overdue', label: `${dl} ⚠` };
            return { cls: 'dl-future', label: dl };
        }

        fmtDT(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
        }

        updateStats() {
            const total     = this.todos.length;
            const completed = this.todos.filter(t => t.completed).length;
            const active    = total - completed;
            this.el.total.textContent     = total;
            this.el.active.textContent    = active;
            this.el.completed.textContent = completed;
            this.el.bAll.textContent       = total;
            this.el.bActive.textContent    = active;
            this.el.bCompleted.textContent = completed;
        }

        render() {
            const list = this.getFiltered();
            const emptyMsg = { all: '할일을 추가해보세요!', active: '진행중인 할일이 없습니다', completed: '완료된 할일이 없습니다' };

            if (!list.length) {
                this.el.list.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📝</div>
                        <p class="empty-state-text">${emptyMsg[this.filter]}</p>
                    </div>`;
            } else {
                this.el.list.innerHTML = list.map((t, fi) => {
                    const bg          = t.color ? `background:${this.hexAlpha(t.color, 0.13)};` : '';
                    const bdr         = t.color ? `border-left-color:${t.color};` : '';
                    const itemStyle   = bg + bdr;
                    const dl   = this.fmtDeadline(t.deadline);
                    const dlHtml = dl
                        ? `<span class="meta-tag ${dl.cls}">📅 ${this.esc(dl.label)}</span>`
                        : '';
                    const doneHtml = t.completedAt
                        ? `<span class="meta-tag done-tag">✓ 완료: ${this.esc(this.fmtDT(t.completedAt))}</span>`
                        : '';
                    const metaHtml = (dlHtml || doneHtml)
                        ? `<div class="todo-meta">${dlHtml}${doneHtml}</div>`
                        : '';
                    const colorBtnStyle   = t.color ? `background:${t.color};border-color:${t.color}` : '';
                    const colorBtnContent = t.color ? '' : '🎨';

                    return `
                        <div class="todo-item ${t.completed ? 'completed' : ''}" data-id="${t.id}" draggable="true" style="${itemStyle}">
                            <div class="drag-handle" title="드래그하여 이동">≡</div>
                            <div class="checkbox ${t.completed ? 'checked' : ''}"></div>
                            <div class="todo-content">
                                <div class="todo-text">${this.esc(t.text)}</div>
                                ${metaHtml}
                            </div>
                            <button class="color-btn" style="${colorBtnStyle}" title="색상 선택">${colorBtnContent}</button>
                            <button class="delete-btn">삭제</button>
                        </div>`;
                }).join('');
            }

            this.updateStats();
        }

        /* ── HISTORY MODAL ── */
        openHistory() {
            this.el.hSearch.value = '';
            this.renderHistory();
            this.el.modal.classList.add('visible');
            this.el.hSearch.focus();
        }

        closeHistory() { this.el.modal.classList.remove('visible'); }

        renderHistory() {
            const q       = this.el.hSearch.value;
            const history = this.db.search(q);

            if (!history.length) {
                this.el.hBody.innerHTML = `<div class="modal-empty">${q ? '검색 결과 없음' : '이력이 없습니다'}</div>`;
                return;
            }

            this.el.hBody.innerHTML = history.map((h, i) => {
                const cls   = h.archiveReason === 'completed' ? 'hr-completed' : 'hr-deleted';
                const lbl   = h.archiveReason === 'completed' ? '✓ 완료' : '🗑 삭제';
                const bdrSt = h.color ? `border-left-color:${h.color}` : '';
                let dates   = `생성: ${this.fmtDT(h.createdAt)}`;
                if (h.deadline)    dates += ` · 마감: ${h.deadline}`;
                if (h.completedAt) dates += ` · 완료: ${this.fmtDT(h.completedAt)}`;
                dates += ` · ${lbl}`;

                return `
                    <div class="history-item ${cls}" style="${bdrSt}">
                        <div class="history-content">
                            <div class="history-text">${this.esc(h.text)}</div>
                            <div class="history-dates">${this.esc(dates)}</div>
                        </div>
                        <button class="history-readd-btn" data-idx="${i}">+ 추가</button>
                    </div>`;
            }).join('');
        }

        readdHistory(idx) {
            const h = this.db.search(this.el.hSearch.value)[idx];
            if (!h) return;
            this.todos.unshift({
                id: Date.now(), text: h.text, completed: false,
                createdAt: new Date().toISOString(),
                deadline: h.deadline || '', color: h.color || '', completedAt: null,
            });
            this.save();
            this.render();
            this.closeHistory();
            this.toast('할일이 추가되었습니다', 'success');
        }

        /* ── UTILS ── */
        hexAlpha(hex, a) {
            if (!hex || hex.length < 7) return '';
            const r = parseInt(hex.slice(1,3), 16);
            const g = parseInt(hex.slice(3,5), 16);
            const b = parseInt(hex.slice(5,7), 16);
            return `rgba(${r},${g},${b},${a})`;
        }

        esc(text) {
            const d = document.createElement('div');
            d.textContent = text;
            return d.innerHTML;
        }

        toast(msg, type = 'info') {
            document.querySelector('.toast')?.remove();
            const el = document.createElement('div');
            el.className = `toast ${type}`;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => {
                el.style.transition = 'opacity 0.25s';
                el.style.opacity = '0';
                setTimeout(() => el.remove(), 260);
            }, 2400);
        }
    }

    const app = new TodoApp();
    </script>
</body>
